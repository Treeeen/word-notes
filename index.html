<script>
const STORAGE_KEY = "word-notes-entries";
const ICONS = {
  plus: "+", trash: "\u2715", volume: "\u25B6", check: "\u2713", x: "\u2715",
  next: "\u2192", retry: "\u21BA", book: "\uD83D\uDCD6"
};

let state = {
  words: JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"),
  view: "library",
  adding: false,
  addStatus: "",
  inputText: "",
  quiz: null,
};

function persist() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.words));
}

function normalize(w) { return w.trim().toLowerCase(); }

function sleep(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

async function lookupWordOnce(word) {
  const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word.trim())}`);
  if (res.status === 429) throw new Error("rate-limited");
  if (!res.ok) return { word: word.trim(), notFound: true, definitions: [], phonetic: "", audio: "" };
  const data = await res.json();
  const entry = data[0];
  let phonetic = entry.phonetic || "";
  let audio = "";
  for (const p of entry.phonetics || []) {
    if (!phonetic && p.text) phonetic = p.text;
    if (!audio && p.audio) audio = p.audio;
  }
  const definitions = [];
  outer:
  for (const meaning of entry.meanings || []) {
    for (const def of meaning.definitions || []) {
      definitions.push({ pos: meaning.partOfSpeech, definition: def.definition, example: def.example || "" });
      if (definitions.length >= 4) break outer;
    }
  }
  return {
    word: entry.word || word.trim(),
    notFound: definitions.length === 0,
    phonetic,
    audio: audio.startsWith("//") ? "https:" + audio : audio,
    definitions,
  };
}

async function lookupWord(word) {
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      return await lookupWordOnce(word);
    } catch (e) {
      if (attempt < 2) await sleep(500 * (attempt + 1));
    }
  }
  return { word: word.trim(), notFound: true, definitions: [], phonetic: "", audio: "" };
}

function playAudio(url) {
  if (!url) return;
  new Audio(url).play().catch(() => {});
}

const CJK_RE = /[\u4e00-\u9fff]/;

const SEED_TEXT = `recollection回忆 记忆

// Parse pasted text into { word, zh } entries. Lines containing Chinese
// characters are treated as a single "word + Kindle meaning" entry
// (e.g. "recollection回忆 记忆"); plain lines fall back to comma/newline
// separated word lists.
function parseEntries(text) {
  const lines = text.split(/\n+/).map(l => l.trim()).filter(Boolean);
  const entries = [];
  for (const line of lines) {
    const m = line.match(CJK_RE);
    if (m) {
      const word = line.slice(0, m.index).trim().replace(/[,:;]+$/, "");
      const zh = line.slice(m.index).trim();
      if (word) entries.push({ word, zh });
    } else {
      line.split(",").map(s => s.trim()).filter(Boolean).forEach(w => entries.push({ word: w, zh: "" }));
    }
  }
  return entries;
}

async function addWordsFromText(text, opts) {
  opts = opts || {};
  const parsed = parseEntries(text);
  if (parsed.length === 0) return;

  const existing = new Set(state.words.map(w => normalize(w.word)));
  const seen = new Set();
  const toFetch = parsed.filter(e => {
    const n = normalize(e.word);
    if (existing.has(n) || seen.has(n)) return false;
    seen.add(n);
    return true;
  });

  if (toFetch.length === 0) {
    state.addStatus = "Those words are already in your library.";
    render();
    return;
  }

  state.adding = true;
  state.addStatus = `Looking up ${toFetch.length} word${toFetch.length > 1 ? "s" : ""}...`;
  render();

  const results = [];
  for (let i = 0; i < toFetch.length; i++) {
    const e = toFetch[i];
    state.addStatus = `Looking up ${i + 1} of ${toFetch.length}: ${e.word}...`;
    render();
    const r = await lookupWord(e.word);
    results.push(Object.assign({}, r, {
      zh: e.zh,
      learned: false,
      id: Date.now() + "-" + Math.random().toString(36).slice(2),
      addedAt: Date.now(),
    }));
    await sleep(120);
  }

  state.words = results.concat(state.words);
  persist();
  if (opts.clearMainInput) state.inputText = "";
  const notFoundCount = results.filter(r => r.notFound).length;
  state.addStatus = notFoundCount
    ? `Added ${results.length}. ${notFoundCount} had no dictionary match — kept as a note.`
    : `Added ${results.length} word${results.length > 1 ? "s" : ""}.`;
  state.adding = false;
  render();
}

function toggleLearned(id) {
  state.words = state.words.map(w => w.id === id ? Object.assign({}, w, { learned: !w.learned }) : w);
  persist();
  render();
}

function removeWord(id) {
  state.words = state.words.filter(w => w.id !== id);
  persist();
  render();
}

async function retryFailedLookups() {
  const failed = state.words.filter(w => w.notFound);
  if (failed.length === 0) return;
  state.adding = true;
  render();
  for (let i = 0; i < failed.length; i++) {
    const w = failed[i];
    state.addStatus = `Retrying ${i + 1} of ${failed.length}: ${w.word}...`;
    render();
    const r = await lookupWord(w.word);
    state.words = state.words.map(item =>
      item.id === w.id
        ? Object.assign({}, item, { notFound: r.notFound, phonetic: r.phonetic, audio: r.audio, definitions: r.definitions })
        : item
    );
    await sleep(120);
  }
  persist();
  const stillFailed = state.words.filter(w => w.notFound).length;
  state.addStatus = stillFailed
    ? `Retried ${failed.length}. ${stillFailed} still have no dictionary match.`
    : `Retried ${failed.length}. All resolved.`;
  state.adding = false;
  render();
}

function definedWords() {
  return state.words.filter(w => w.definitions && w.definitions.length > 0);
}

function buildQuestion(pool, index, score) {
  if (index >= pool.length) return { pool, index, score, done: true };
  const correct = pool[index];
  const correctDef = correct.definitions[0].definition;
  const distractorPool = definedWords().filter(w => w.id !== correct.id);
  const distractors = [...distractorPool].sort(() => Math.random() - 0.5).slice(0, 3).map(w => w.definitions[0].definition);
  const options = [correctDef].concat(distractors).sort(() => Math.random() - 0.5);
  return { pool, index, score, correctDef, options, selected: null, answered: false, word: correct };
}

function startQuiz() {
  const dw = definedWords();
  const unlearned = dw.filter(w => !w.learned);
  const base = unlearned.length >= 4 ? unlearned : dw;
  const pool = [...base].sort(() => Math.random() - 0.5).slice(0, 10);
  state.quiz = buildQuestion(pool, 0, 0);
  render();
}

function answerQuiz(opt) {
  if (!state.quiz || state.quiz.answered) return;
  const isCorrect = opt === state.quiz.correctDef;
  state.quiz = Object.assign({}, state.quiz, { selected: opt, answered: true, score: state.quiz.score + (isCorrect ? 1 : 0) });
  render();
}

function nextQuestion() {
  if (!state.quiz) return;
  state.quiz = buildQuestion(state.quiz.pool, state.quiz.index + 1, state.quiz.score);
  render();
}

function el(html) {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  [["library", "Library"], ["add", "Add"], ["quiz", "Quiz"]].forEach(([id, label]) => {
    const btn = document.createElement("button");
    btn.className = "tab" + (state.view === id ? " active" : "");
    btn.textContent = label;
    btn.onclick = () => { state.view = id; if (id === "quiz") state.quiz = null; render(); };
    tabs.appendChild(btn);
  });
}

function renderQuickAdd(container) {
  const wrap = document.createElement("div");
  wrap.className = "quickadd-row-wrap";
  wrap.innerHTML = `
    <div class="quickadd-row">
      <input type="text" id="quickAddInput" placeholder="New word, or paste 'word 中文' from Kindle…" value="${state.quickText || ""}" />
      <button class="btn-primary" id="quickAddBtn" ${state.adding ? "disabled" : ""}>${state.adding ? '<span class="spin">↻</span>' : ICONS.plus}</button>
    </div>
    ${state.addStatus ? `<div class="status-line">${state.addStatus}</div>` : ""}
  `;
  container.appendChild(wrap);
  const input = wrap.querySelector("#quickAddInput");
  const btn = wrap.querySelector("#quickAddBtn");
  const submit = () => {
    const val = input.value;
    if (!val.trim() || state.adding) return;
    addWordsFromText(val);
  };
  input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  btn.addEventListener("click", submit);
}

function renderLibrary(container) {
  renderQuickAdd(container);

  if (state.words.length === 0) {
    const empty = el(`
      <div class="empty">
        <div style="font-size:32px;margin-bottom:12px;opacity:.6">${ICONS.book}</div>
        <p style="margin:0 0 16px;font-size:15px">No words yet. Add the ones from your Kindle notes above, or use the full Add tab.</p>
        <button class="btn-primary" id="openAddTab">Open Add tab</button>
      </div>
    `);
    container.appendChild(empty);
    empty.querySelector("#openAddTab").onclick = () => { state.view = "add"; render(); };
    return;
  }

  const learnedCount = state.words.filter(w => w.learned).length;
  const countRow = document.createElement("div");
  countRow.className = "word-count-row";
  countRow.innerHTML = `
    <span class="word-count">${state.words.length} word${state.words.length !== 1 ? "s" : ""} saved</span>
    <span class="word-count">${learnedCount} learned</span>
  `;
  container.appendChild(countRow);

  const failedCount = state.words.filter(w => w.notFound).length;
  if (failedCount > 0) {
    const retryWrap = el(`
      <div style="margin-bottom:14px">
        <button class="btn-ghost" id="retryFailedBtn" style="border:1px dashed #B4553F;border-radius:8px;padding:8px 12px;font-size:13px;color:#C98470" ${state.adding ? "disabled" : ""}>
          ${state.adding ? '<span class="spin">↻</span> ' : ""}Retry ${failedCount} word${failedCount > 1 ? "s" : ""} with no definition
        </button>
        ${state.addStatus ? `<div class="status-line">${state.addStatus}</div>` : ""}
      </div>
    `);
    container.appendChild(retryWrap);
    retryWrap.querySelector("#retryFailedBtn").onclick = retryFailedLookups;
  }

  state.words.forEach(w => {
    const card = document.createElement("div");
    card.className = "card" + (w.learned ? " learned" : "");
    let defsHtml = "";
    if (w.notFound) {
      defsHtml = `<p style="font-size:13px;color:#8A93A0;margin-top:8px;font-style:italic">No dictionary entry found for this one — kept as a note.</p>`;
    } else {
      defsHtml = `<div style="margin-top:10px;display:flex;flex-direction:column;gap:8px">` +
        w.definitions.map(d => `
          <div>
            <div style="font-size:14px"><span class="pos">${d.pos}</span>${d.definition}</div>
            ${d.example ? `<div class="example">"${d.example}"</div>` : ""}
          </div>
        `).join("") + `</div>`;
    }
    card.innerHTML = `
      <button class="learned-btn" title="${w.learned ? "Mark as still learning" : "Mark as learned"}">${w.learned ? ICONS.check : ""}</button>
      <button class="btn-ghost remove-btn" title="Remove">${ICONS.trash}</button>
      <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
        <span class="headword word-serif">${w.word}</span>
        ${w.phonetic ? `<span class="phonetic word-mono">${w.phonetic}</span>` : ""}
        ${w.audio ? `<button class="play-btn" title="Play pronunciation">${ICONS.volume}</button>` : ""}
      </div>
      ${w.zh ? `<div class="zh">${w.zh}</div>` : ""}
      ${defsHtml}
    `;
    card.querySelector(".remove-btn").onclick = () => removeWord(w.id);
    card.querySelector(".learned-btn").onclick = () => toggleLearned(w.id);
    const playBtn = card.querySelector(".play-btn");
    if (playBtn) playBtn.onclick = () => playAudio(w.audio);
    container.appendChild(card);
  });
}

function renderAdd(container) {
  const wrap = el(`
    <div>
      <label style="display:block;font-size:13px;color:#9BA5B1;margin-bottom:8px">
        Paste straight from your Kindle notes — "word 中文释义" one per line — or just plain words, one per line or separated by commas.
      </label>
      <textarea id="addTextarea" rows="7" placeholder="recollection回忆 记忆&#10;profound 发自心底的 深远的&#10;ephemeral"></textarea>
      <div style="margin-top:10px">
        <button class="btn-ghost" id="loadSeedBtn" style="border:1px dashed #2A3542;border-radius:8px;padding:8px 12px;font-size:13px;color:#B7A98A">
          Load all 116 words from your Kindle notes
        </button>
      </div>
      <div style="display:flex;align-items:center;gap:12px;margin-top:14px">
        <button class="btn-primary" id="addBtn" ${state.adding ? "disabled" : ""}>
          ${state.adding ? '<span class="spin">↻</span> Looking up…' : ICONS.plus + " Add words"}
        </button>
        ${state.addStatus ? `<span style="font-size:13px;color:#8A93A0">${state.addStatus}</span>` : ""}
      </div>
    </div>
  `);
  container.appendChild(wrap);
  const ta = wrap.querySelector("#addTextarea");
  ta.value = state.inputText;
  ta.addEventListener("input", () => { state.inputText = ta.value; });
  wrap.querySelector("#addBtn").onclick = () => addWordsFromText(ta.value, { clearMainInput: true });
  wrap.querySelector("#loadSeedBtn").onclick = () => {
    ta.value = SEED_TEXT;
    state.inputText = SEED_TEXT;
  };
}

function renderQuiz(container) {
  const dw = definedWords();
  if (dw.length < 4) {
    container.appendChild(el(`
      <div class="empty">
        <div style="font-size:32px;margin-bottom:12px;opacity:.6">🧠</div>
        <p style="font-size:15px">Add at least 4 words with definitions to unlock the quiz.</p>
      </div>
    `));
    return;
  }

  if (!state.quiz) {
    const wrap = el(`
      <div class="empty">
        <p style="color:#9BA5B1;margin-bottom:18px;font-size:15px">Test yourself on ${Math.min(10, dw.length)} words from your library.</p>
        <button class="btn-primary" id="startQuizBtn">Start quiz</button>
      </div>
    `);
    container.appendChild(wrap);
    wrap.querySelector("#startQuizBtn").onclick = startQuiz;
    return;
  }

  if (state.quiz.done) {
    const wrap = el(`
      <div class="empty">
        <p class="word-serif" style="font-size:26px;margin-bottom:6px">${state.quiz.score} / ${state.quiz.pool.length}</p>
        <p style="color:#8A93A0;margin-bottom:20px;font-size:14px">Quiz complete</p>
        <button class="btn-primary" id="retryQuizBtn">${ICONS.retry} Try again</button>
      </div>
    `);
    container.appendChild(wrap);
    wrap.querySelector("#retryQuizBtn").onclick = startQuiz;
    return;
  }

  const q = state.quiz;
  const wrap = el(`
    <div>
      <div class="quiz-progress">
        <span>Question ${q.index + 1} of ${q.pool.length}</span>
        <span>Score: ${q.score}</span>
      </div>
      <div class="quiz-word-card">
        <span class="headword word-serif">${q.word.word}</span>
        ${q.word.phonetic ? `<div class="phonetic word-mono">${q.word.phonetic}</div>` : ""}
      </div>
      ${q.answered && q.word.zh ? `<p style="text-align:center;font-size:13px;color:#B7A98A;margin:-10px 0 14px">${q.word.zh}</p>` : ""}
      <p class="quiz-prompt">Which definition matches?</p>
      <div id="quizOptions"></div>
      ${q.answered ? `<button class="btn-primary" id="nextQBtn">${q.index + 1 >= q.pool.length ? "See results" : "Next"} ${ICONS.next}</button>` : ""}
    </div>
  `);
  container.appendChild(wrap);
  const optsContainer = wrap.querySelector("#quizOptions");
  q.options.forEach(opt => {
    const isSelected = q.selected === opt;
    const isCorrectOpt = opt === q.correctDef;
    let cls = "quiz-option";
    if (q.answered && isCorrectOpt) cls += " correct";
    else if (q.answered && isSelected && !isCorrectOpt) cls += " wrong";
    const btn = document.createElement("button");
    btn.className = cls;
    btn.disabled = q.answered;
    btn.innerHTML = `<span>${opt}</span><span>${q.answered && isCorrectOpt ? ICONS.check : (q.answered && isSelected ? ICONS.x : "")}</span>`;
    btn.onclick = () => answerQuiz(opt);
    optsContainer.appendChild(btn);
  });
  if (q.answered) wrap.querySelector("#nextQBtn").onclick = nextQuestion;
}

function render() {
  renderTabs();
  const main = document.getElementById("main");
  main.innerHTML = "";
  if (state.view === "add") renderAdd(main);
  else if (state.view === "quiz") renderQuiz(main);
  else renderLibrary(main);
}

render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
